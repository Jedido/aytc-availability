name: Publish availability

on:
  # Daily at 9:10 AM Seattle time. Cron is UTC, so both offsets are listed
  # and the "gate" job skips the one that doesn't match the current season.
  # (GitHub may start scheduled runs late.)
  schedule:
    - cron: "10 17 * * *" # 9:10 PST (winter)
    - cron: "10 16 * * *" # 9:10 PDT (summer)
  workflow_dispatch: # manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Runners use UTC; dates must be computed in Seattle time.
  TZ: America/Los_Angeles

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          zone=$(date +%Z) # PST or PDT (TZ is America/Los_Angeles)
          run=true
          if [ "$EVENT" = "schedule" ]; then
            if [ "$zone" = "PST" ] && [ "$SCHEDULE" != "10 17 * * *" ]; then run=false; fi
            if [ "$zone" = "PDT" ] && [ "$SCHEDULE" != "10 16 * * *" ]; then run=false; fi
          fi
          echo "zone=$zone schedule='$SCHEDULE' run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          # Yesterday's results, to work out which openings are new.
          PREVIOUS_JSON: https://jedido.github.io/aytc-availability/availability.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Notify phone
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC not set; skipping"; exit 0; fi
          if [ ! -f notification.json ]; then echo "No new openings; skipping"; exit 0; fi
          curl -sS -H "Title: $(jq -r .title notification.json)" -H "Tags: tennis" -H "Click: $PAGE_URL" \
            --data-binary "$(jq -r .body notification.json)" "https://ntfy.sh/$NTFY_TOPIC"
