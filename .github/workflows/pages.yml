name: Publish availability

on:
  # Started by a Google Cloud Scheduler job through the GitHub API (GitHub's own
  # cron ran too late), or by hand with the "Run workflow" button.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Runners use UTC; dates must be computed in Seattle time.
  TZ: America/Los_Angeles

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          # The previous run's results, to work out which openings are new.
          PREVIOUS_JSON: https://jedido.github.io/aytc-availability/availability.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Notify phone
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC not set; skipping"; exit 0; fi
          if [ ! -f notification.json ]; then echo "No new openings; skipping"; exit 0; fi
          curl -sS -H "Title: $(jq -r .title notification.json)" -H "Tags: tennis" -H "Priority: 5" -H "Click: $PAGE_URL" \
            --data-binary "$(jq -r .body notification.json)" "https://ntfy.sh/$NTFY_TOPIC"
